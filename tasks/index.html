eate`.\n\n## Requirements\n- Edit `/home/user/project/openapi.yaml` in place to add an `x-speakeasy-name-override` rule that renames the `pst_user_create` operation to `createUser`.\n- Either form documented by Speakeasy is acceptable:\n  - Operation-level: `paths./users.post.x-speakeasy-name-override: createUser`.\n  - Global-level: a top-level `x-speakeasy-name-override` list containing an entry that matches operationId `pst_user_create` (an exact-match regex is fine) with `methodNameOverride: createUser`.\n- Do **not** change the existing `operationId` `pst_user_create` itself. The renaming must come from the extension.\n- Do **not** remove or rename any existing operations, paths, or schemas. Keep the OpenAPI version as `3.0.x` and keep the `User` schema component intact.\n- After your edits, the spec must remain valid: running `speakeasy lint openapi -s /home/user/project/openapi.yaml --non-interactive` must still exit with code 0.\n\n## Implementation Hints\n- The Speakeasy CLI is preinstalled and available on the `PATH` as `speakeasy`. `yq` is also available for YAML inspection.\n- Refer to the Speakeasy documentation for `x-speakeasy-name-override` on the \"Customize methods\" page; both global and operation-level placements are documented and accepted.\n- When using the global form, remember that the matching key is `operationId` (a regex) and the value key is `methodNameOverride`.\n- When using the operation-level form, the extension is a plain string value placed directly on the operation object.\n- You only need to modify `openapi.yaml`. Do not introduce additional files or change the project layout.\n\n## Acceptance Criteria\n- Project path: /home/user/project\n- Spec file: /home/user/project/openapi.yaml\n- The spec still parses as valid YAML and declares OpenAPI `3.0.x`.\n- The spec still contains the original path `/users` with method `post` and operationId `pst_user_create`, and the `User` schema component.\n- `openapi.yaml` contains an `x-speakeasy t the fields.\n- The Speakeasy CLI (`speakeasy`) and `yq` are installed in the environment if you want to use them for inspection.\n\n## Acceptance Criteria\n- Project path: /home/user/project\n- The file `/home/user/project/gen.yaml` exists and is valid YAML.\n- In `gen.yaml`, the value at `.typescript.packageName` equals `@example/my-sdk`.\n- In `gen.yaml`, the value at `.typescript.author` equals `Example Team`.\n- The TypeScript `version` field (`.typescript.version`) and the top-level `configVersion` field remain present and unchanged.\n\n"])</script><script>self.__next_f.push([1,"e:T8d1,"])</script><script>self.__next_f.push([1,"# Enable OAuth 2.0 Client Credentials in Speakeasy gen.yaml\n\n## Background\nSpeakeasy generates idiomatic SDKs from OpenAPI specifications. The `gen.yaml` file is the primary configuration file for SDK generation targets, and the `generation.auth` section controls authentication-related code generation. To support APIs that authenticate via the OAuth 2.0 client-credentials flow, Speakeasy exposes the `oAuth2ClientCredentialsEnabled` flag under `generation.auth`. When set to `true`, Speakeasy generates the code required to handle OAuth 2.0 client credentials in the generated SDK.\n\nA partial Speakeasy project has been initialized at `/home/user/project`. The existing `gen.yaml` configures a TypeScript SDK target but currently has `oAuth2ClientCredentialsEnabled: false`. Your job is to flip this single flag on so the next generation run will produce SDK code that supports the OAuth 2.0 client-credentials flow.\n\n## Requirements\n- Edit `/home/user/project/gen.yaml` so that `generation.auth.oAuth2ClientCredentialsEnabled` is set to `true`.\n- Do **not** rename, remove, or restructure any other fields in `gen.yaml`. All existing keys (configuration version, SDK class name, language target, etc.) must remain valid and unchanged in meaning.\n- The resulting `gen.yaml` must still be valid YAML that Speakeasy can read.\n\n## Implementation ion.\n3. Create `.speakeasy/gen.yaml` with the `cli` target configuration.\n4. Run `speakeasy lint config` to ensure your configuration is valid.\n\n## Constraints\n- Project path: /home/user/myproject\n- Do not attempt to use commands that require authentication (like `speakeasy generate` or `speakeasy configure`). You must create the configuration files manually based on Speakeasy documentation.11:T897,"])</script><script>self.__next_f.push([1,"# Create a Basic Speakeasy Workflow File\n\n## Background\nSpeakeasy is an AI-native API development platform that generates idiomatic, type-safe artifacts (SDKs, Terraform providers, CLIs, MCP servers) from OpenAPI specifications. The Speakeasy CLI is driven by a `.speakeasy/workflow.yaml` file that maps one or more OpenAPI **sources** to one or more code-generation **targets**.\n\nYou have a minimal OpenAPI 3.0 specification (`openapi.yaml`) in the project root. Author a `.speakeasy/workflow.yaml` from scratch so that it would drive a single TypeScript SDK generation from this spec.\n\n## Requirements\n- Create the workflow file at `/home/user/project/.speakeasy/workflow.yaml`.\n- Define exactly one source named `my-api` whose only input location is the local file `./openapi.yaml`.\n- Define exactly one target named `typescript-sdk` whose `target` type is `typescript` and whose `source` is `my-api`.\n- The workflow must be structurally valid per the Speakeasy workflow schema (top-level `workflowVersion`, `sources`, and `targets` keys).\n- Do not run `speakeasy quickstart` or any command that requires authentication; create the file manually based on the workflow.yaml reference.\n\n## Implementation Hints\n- The top-level structure of `workflow.yaml` is `workflowVersion`, optional `speakeasyVersion`, `sources`, and `targets`.\n- A source has an `inputs` list, where each entry is an object with a `location` key pointing to an OpenAPI document.\n- A target has a `target` field (language/artifact type) and a `source` field referencing the source name.\n- Refer to the Speakeasy workflow file documentation for the exact schema.\n- You can sanity-check structure with `yq` or by inspecting `speakeasy run --help`.\n\n## Acceptance Criteria\n- Project path: /home/user/project\n- The file `/home/user/project/.speakeasy/workflow.yaml` must exist and be valid YAML.\n- The YAML must contain a top-level `workflowVersion` string.\n- Under `sources`, a key `my-api` must exist with `inputs[0].location` equal to `./openapi.yaml`.\n- Under `targets`, a key `typescript-sdk` must exist with `target: typescript` and `source: my-api`.\n- The seed file `/home/user/project/openapi.yaml` must remain unchanged.\n\n"])</script><script>self.__next_f.push([1,"12:T5c5,"])</script><script>self.__next_f.push([1,"# Generate Python SDK with Pagination\n\n## Background\nSpeakeasy SDKs support automatic pagination. You can configure this by adding the `x-speakeasy-pagination` extension to the OpenAPI description. We have an existing OpenAPI specification for a simple API with a paginated `/items` endpoint.\n\n## Requirements\n- Modify the OpenAPI specification at `/home/user/openapi.yaml` to include the `x-speakeasy-pagination` extension for the `GET /items` operation.\n- The pagination configuration must use the `offsetLimit` type.\n- It must map the `page` query parameter as the page input.\n- It must extract the output results from the `$.data` field of the response.\n- After modifying the spec, use the Speakeasy CLI to generate a Python SDK into the `/home/user/sdk` directory.\n\n## Implementation Guide\n1. Open `/home/user/openapi.yaml`.\n2. Locate the `GET /items` operation.\n3. Add the `x-speakeasy-pagination` extension to the operation with the following structure:\n   ```yaml\n   x-speakeasy-pagination:\n     type: offsetLimit\n     inputs:\n       - name: page\n         in: parameters\n         type: page\n     outputs:\n       results: $.data\n   ```\n4. Generate the Python SDK using the Speakeasy CLI:\n   `` nerated SDKs using hooks. In this task, you will generate a Go SDK from an OpenAPI specification and implement a custom response hook that intercepts all successful responses and injects a specific header before returning the response to the caller.\n\n## Requirements\n- You are provided with a Speakeasy project in `/home/user/project` containing `openapi.yaml` and `gen.yaml` configured for Go SDK generation.\n- Run `speakeasy generate sdk` to scaffold the SDK and the `internal/hooks` directory.\n- Implement an `AfterSuccessHook` in Go that adds an `X-Hook-Injected` header with the value `true` to every successful HTTP response (`http.Response`).\n- Register the hook correctly in the generated registration file so that it is executed by the SDK.\n- Ensure the Go code compiles successfully (`go build ./...` inside the `sdk` directory).\n\n## Implementation Guide\n1. Move to `/home/user/project`.\n2. Run `speakeasy generate sdk` to scaffold the SDK.\n3. Create or modify the hook implementation in `sdk/internal/hooks/` to intercept successful responses and append the `X-Hook-Injected: true` header to the `http.Response.Header` map.\n4. Register your hook in `sdk/internal/hooks/registration.go`.\n5. Run `go mod tidy` and `go build ./...` inside the `sdk` directory to ensure there are no compilation errors.\n\n## Constraints\n- Project path: `/home/user/project`\n- The header name must be exactly `X-Hook-Injected`.\n- The header value must be exactly `true`.\n- The SDK language must be Go.\n- The hook must be an `AfterSuccessHook`.\n\n## Integrations\n- Speakeasy"])</script><script>self.__next_f.push([1,"15:T642,"])</script><script>self.__next_f.push([1,"# Implement a Python Request Hook in Speakeasy\n\n## Background\nSpeakeasy allows customizing generated SDKs using hooks. In this task, you will generate a Python SDK from an OpenAPI specification and implement a custom request hook that injects a specific header into all outgoing requests.\n\n## Requirements\n- Initiali lation-id`, the hook should throw a new standard `Error` with the exact message: `Correlation Error: \u003ccorrelation_id\u003e` (replace `\u003ccorrelation_id\u003e` with the actual header value).\n- If the condition is not met, the hook must return the original `response` and `error` unchanged as `{ response, error }`.\n- Register the hook in `src/hooks/registration.ts` by calling `hooks.registerAfterErrorHook(new CorrelationHook())`.\n\n## Implementation Guide\n1. Navigate to `/home/user/sdk`.\n2. Create `src/hooks/custom/correlation.ts`.\n3. Implement the `CorrelationHook` class using the `AfterErrorHook` and `AfterErrorContext` interfaces from `../types.js`.\n4. Update `src/hooks/registration.ts` to import and register your hook in `initHooks(hooks: Hooks)`.\n5. Run `npx tsc --noEmit` in the `sdk` directory to ensure there are no TypeScript errors.\n\n## Constraints\n- Project path: /home/user/sdk\n- Do not modify `src/hooks/types.ts`.\n- Ensure you export `CorrelationHook` from `correlation.ts`."])</script><script>self.__next_f.push([1,"17:T4cc,# Add Response Examples with OpenAPI Overlay\n\n## Background\nOpenAPI Overlays are a standard way to modify or extend an OpenAPI specification without changing the original source file. In this task, you will use the Speakeasy CLI to apply an overlay that adds a response example to an existing API endpoint.\n\n## Requirements\n- Create an `overlay.yaml` file conforming to the OpenAPI Overlay Specification 1.0.0.\n- The overlay must target the `GET /ping` operation's `200` response in the provided `openapi.yaml`.\n- It should add a `content` object for `application/json` with an `example` of `{\"message\": \"pong\"}`.\n- Apply the overlay using the Speakeasy CLI and save the merged output to `openapi-modified.yaml`.\n\n## Implementation Guide\n1. Review the `openapi.yaml` file in the project directory.\n2. Create an `overlay.yaml` file that uses JSONPath `$.paths['/ping'].get.responses['200']` to add the required `content` object.\n3. Run the following command to apply the overlay:\n   `speakeasy overlay apply -o overlay.yaml -s openapi.yaml --out openapi-modified.yaml`\n\n## Constraints\n- Project path: `/home/user/project`\n- Do not modify the original `openapi.yaml` directly.\n- Use the `speakeasy` CLI which is already installed.18:Tba5,"])</script><script>self.__next_f.push([1,"# Hide Internal Endpoints with a Speakeasy OpenAPI Overlay\n\n## Background\nYour team maintains an OpenAPI 3 specification that mixes public-facing endpoints with internal-only endpoints (for example, `/internal/health`). You want to ship a public SDK that excludes the internal endpoints, but you cannot modify the source `openapi.yaml`. Speakeasy supports the [OpenAPI Overlay Specification](https://overlays.openapi.org/) and provides a `speakeasy overlay` CLI to author and apply overlays.\n\nIn this task, you must author an OpenAPI Overlay that marks the internal GET operation on `/internal/health` with the Speakeasy extension `x-speakeasy-ignore: true`, then apply that overlay against the base spec to produce a merged `result.yaml`.\n\n## Requirements\n- Create an overlay file at `/home/user/project/overlay.yaml` that conforms to the OpenAPI Overlay Specification v1.0.0.\n- The overlay must contain at least one action whose `target` JSONPath expression resolves to the `get` operation on the `/internal/health` path of the base spec.\n- The matching action must use an `update` block that adds the extension `x-speakeasy-ignore: true` to that operation.\n- Apply the overlay against the base spec `/home/user/project/openapi.yaml` using the Speakeasy CLI, writing the merged document to `/home/user/project/result.yaml`.\n- Do **not** modify the original `/home/user/project/openapi.yaml`; the public operation(s) must remain unchanged in `result.yaml`.\n\n## Implementation Hints\n- The Speakeasy CLI exposes an `overlay` command group; its `apply` subcommand merges an overlay onto a base schema. Use the documented flags to point at the schema and the overlay, and to write the output to a file.\n- A minimal overlay document has top-level `overlay`, `info`, and `actions` keys. Each action needs a `target` (JSONPath) and either `update` or `remove`.\n- JSONPath expressions in overlays start with `$`. To address the GET operation on `/internal/health`, use a bracket-notation path that escapes the literal `/` characters (e.g. `$.paths[\"/internal/health\"].get`).\n- You may run `speakeasy overlay validate` first to sanity-check your overlay before applying it.\n\n## Acceptance Criteria\n- Project path: /home/user/project\n- `/home/user/project/overlay.yaml` exists and:\n  - Has top-level key `overlay` with value `1.0.0`.\n  - Has an `info.title` and `info.version`.\n  - Contains an `actions` entry whose `target` JSONPath resolves to the GET operation on `/internal/health`.\n  - That action contains an `update` block setting `x-speakeasy-ignore` to `true`.\n- `/home/user/project/result.yaml` exists and:\n  - Is a valid OpenAPI 3 document derived from `openapi.yaml` with the overlay applied.\n  - `paths./internal/health.get.x-speakeasy-ignore` is the boolean `true`.\n  - The public operation under `/public/items` (GET) is preserved with no `x-speakeasy-ignore` key.\n- The original `/home/user/project/openapi.yaml` must remain byte-for-byte identical to its seeded contents.\n\n"])</script><script>self.__next_f.push([1,"19:T772,"])</script><script>self.__next_f.push([1,"# Configure `maxMethodParams` for the TypeScript SDK in Speakeasy `gen.yaml`\n\n## Background\nSpeakeasy generates idiomatic, type-safe client SDKs from an OpenAPI specification. SDK method signatures can either accept a single request object or a list of positional parameters. The `maxMethodParams` option in `gen.yaml` controls the threshold at which Speakeasy switches from positional parameters to a single input object. The default value `0` means every method always uses an input object. Increasing this value gives SDK consumers a more ergonomic call-site experience for small parameter sets.\n\nThe SDK project lives at `/home/user/project` and already has a `gen.yaml` with a top-level `typescript:` block (alongside other top-level blocks such as `generation:` and `configVersion:`). Your job is to tune the TypeScript SDK generation configuration without changing any other settings.\n\n## Requirements\n- Edit `/home/user/project/gen.yaml` so that the TypeScript SDK is generated using positional parameters for methods with up to four parameters before falling back to an input object.\n- Do not change unrelated keys (other fields inside `typescript:` and other top-level blocks must be preserved).\n\n## Implementation Hints\n- Refer to the Speakeasy `gen.yaml` reference and TypeScript configuration options to confirm the correct field path; the field lives under the top-level `typescript:` block (it is not nested under any `targets:` section).\n- Any YAML-aware tool (a text editor or a CLI such as `yq`) can be used to apply the change.\n\n## Acceptance Criteria\n- Project path: /home/user/project\n- File modified: /home/user/project/gen.yaml\n- The top-level `typescript.maxMethodParams` value in `gen.yaml` is `4`.\n- All other previously-present keys in the `typescript:` block and all other top-level blocks remain present with their original values.\n- `gen.yaml` remains a valid YAML document.\n\n"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"b\":\"LgQyVcTa1np_UvCnH-y5f\",\"c\":[\"\",\"tasks\",\"\"],\"q\":\"\",\"i\":false,\"f\":[[[\"\",{\"children\":[\"tasks\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",true],[[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/speakeasy-benchmark/_next/static/chunks/aae6fc4800eaf3c2.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-0\",{\"src\":\"/speakeasy-benchmark/_next/static/chunks/babff0e7418ab052.js
